[project]
name = "samsara"
version = "0.1.0"
description = "Simulate, prep, plot, and analyze GPS trip data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
samsara-get-data = "samsara.route_gps_sim:main"
samsara-prep-data = "samsara.prep_data:main"
samsara-plot = "samsara.plot:main"
samsara-solve = "samsara.solution:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samsara"]
